<svg class="tk-diagram tk-tracking" viewBox="0 0 1200 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tkr-title tkr-desc">
<title id="tkr-title">How each toktoit run is recorded and mirrored to Simvue</title>
<desc id="tkr-desc">Diagram. On the left, the toktoit commands that run physics: torax, torax-loop, benchmark-raptor, equilibrium, ascot-alpha, ascot-apply and run, plus dataset generation (M2) and surrogate training (M3), which are planned. Each opens one run record. In the middle, the life of a run: start_run records the configuration and provenance (git commit, package versions, configuration hash, input hashes); log_params records the settings; the compiled loop runs with no tracking calls inside and returns its full trace; log_series then writes one record per step with the step number and simulation time; alerts and events are raised; output files are saved with their provenance; finish marks the run completed or failed. On the right, every call goes to two places: a local record under runs/, always written, and a Simvue mirror. On a login node the mirror writes to the Simvue server directly; inside a SLURM job it writes to an offline cache, which make simvue-push uploads from a login node. On the server each run sits in folder /tkit/&lt;command&gt; with tags, metadata, metrics against step and simulation time, events, alerts and files. If Simvue cannot start, the run continues on the local record.</desc>
<defs><marker id="tkr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="tkr-ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker></defs>
